services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gen
      POSTGRES_PASSWORD: gen
      POSTGRES_DB: gen
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gen -d gen"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: ["/app/entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://gen:gen@db:5432/gen
      WEBHOOK_SECRET: test-secret
      PROVIDER_TIMEOUT: "60"
      HTTP_TIMEOUT: "5"
      WATCHDOG_INTERVAL: "1"
      ALPHA_URL: http://alpha:8000
      BETA_URL: http://beta:8000
      PUBLIC_BASE_URL: http://api:8000
    ports:
      - "18000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      alpha:
        condition: service_started
      beta:
        condition: service_started

  alpha:
    build: .
    command: ["uvicorn", "providers.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      DATABASE_URL: postgresql+asyncpg://gen:gen@db:5432/gen
      PROVIDER_NAME: alpha
      WEBHOOK_SECRET: test-secret
      WEBHOOK_URL: http://api:8000/webhooks/providers/alpha
      PROVIDER_TIMEOUT: "60"
    ports:
      - "18001:8000"

  beta:
    build: .
    command: ["uvicorn", "providers.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      DATABASE_URL: postgresql+asyncpg://gen:gen@db:5432/gen
      PROVIDER_NAME: beta
      WEBHOOK_SECRET: test-secret
      WEBHOOK_URL: http://api:8000/webhooks/providers/beta
      PROVIDER_TIMEOUT: "60"
    ports:
      - "18002:8000"
